name: Build Vega exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix project layout
        shell: pwsh
        run: |
          Write-Host "Repo root contains:"
          Get-ChildItem -Name
          if (-not (Test-Path "main.py")) {
            $found = Get-ChildItem -Recurse -Filter main.py -File | Where-Object { $_.FullName -notmatch "\\.github\\" } | Select-Object -First 1
            if ($found) {
              Write-Host "Found project in $($found.DirectoryName), copying it to the root"
              Copy-Item -Path (Join-Path $found.DirectoryName "*") -Destination . -Recurse -Force
            } else {
              Write-Host "main.py not found anywhere, recreating it"
              Set-Content -Path main.py -Value "import sys`nfrom vega.app import main`n`nif __name__ == '__main__':`n    sys.exit(main())"
            }
          }
          if (-not (Test-Path "vega/app.py")) {
            Write-Host "ERROR: vega/app.py is missing. The vega folder was not uploaded correctly."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow pyinstaller

      - name: Make icon
        run: python tools_dev/make_icon.py

      - name: Build exe
        shell: pwsh
        run: |
          if (Test-Path "vega.spec") {
            python -m PyInstaller vega.spec --noconfirm --clean
          } else {
            python -m PyInstaller main.py --name Vega --noconfirm --clean --windowed --icon assets/vega.ico --add-data "assets;assets" --collect-submodules vega --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all av --collect-all tokenizers --collect-all edge_tts --collect-all sounddevice --collect-all keyring --collect-all pyautogui --hidden-import win32timezone --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32com.client --hidden-import keyring.backends.Windows
          }

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist/Vega -DestinationPath Vega-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-windows
          path: Vega-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vega-windows.zip
