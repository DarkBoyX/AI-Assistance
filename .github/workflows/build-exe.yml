name: Build Vega exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repo files
        shell: pwsh
        run: Get-ChildItem -Name

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow pyinstaller

      - name: Make icon
        run: python tools_dev/make_icon.py

      - name: Make sure vega.spec exists
        shell: pwsh
        run: |
          if (-not (Test-Path "vega.spec")) {
            Write-Host "vega.spec missing, recreating it"
            @'
          # PyInstaller spec
          from PyInstaller.utils.hooks import collect_all, collect_submodules

          datas, binaries, hidden = [("assets", "assets")], [], []
          for pkg in ("faster_whisper", "ctranslate2", "onnxruntime", "av", "tokenizers", "edge_tts", "sounddevice",
                      "_sounddevice_data", "keyring", "certifi", "pyautogui", "pyscreeze", "pytweening", "pymsgbox", "mouseinfo"):
              try:
                  d, b, h = collect_all(pkg)
                  datas += d; binaries += b; hidden += h
              except Exception:
                  pass
          hidden += collect_submodules("vega") + ["win32timezone", "pythoncom", "pywintypes", "win32com.client",
                                                   "keyring.backends.Windows", "PySide6.QtMultimedia"]

          a = Analysis(["main.py"], pathex=["."], binaries=binaries, datas=datas, hiddenimports=hidden,
                       excludes=["tkinter", "matplotlib", "pytest"], noarchive=False)
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [], exclude_binaries=True, name="Vega", console=False, icon="assets/vega.ico")
          coll = COLLECT(exe, a.binaries, a.datas, name="Vega")
          '@ | Set-Content -Path vega.spec -Encoding utf8
          }

      - name: Build exe
        run: python -m PyInstaller vega.spec --noconfirm --clean

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist/Vega -DestinationPath Vega-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-windows
          path: Vega-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vega-windows.zip
