name: Build Vega exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Make icon
        run: python tools_dev/make_icon.py

      - name: Build exe
        run: pyinstaller vega.spec --noconfirm --clean

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist/Vega -DestinationPath Vega-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-windows
          path: Vega-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vega-windows.zip
