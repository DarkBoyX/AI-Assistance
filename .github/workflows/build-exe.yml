name: Build Vega exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix project layout
        shell: pwsh
        run: |
          Write-Host "Repo root contains:"
          Get-ChildItem -Name

          if (-not (Test-Path "requirements.txt") -or -not (Test-Path "main.py")) {
            $found = Get-ChildItem -Recurse -Filter requirements.txt -File | Where-Object { $_.FullName -notmatch '\\\.github\\' } | Select-Object -First 1
            if ($found) {
              Write-Host "Found project in $($found.DirectoryName), copying it to the root"
              Copy-Item -Path (Join-Path $found.DirectoryName "*") -Destination . -Recurse -Force
            }
          }

          if (-not (Test-Path "requirements.txt")) {
            Write-Host "requirements.txt missing, recreating it"
            @(
              'PySide6>=6.6',
              'numpy>=1.26',
              'sounddevice>=0.4.6',
              'faster-whisper>=1.0.3',
              'edge-tts>=6.1.12',
              'httpx>=0.27',
              'keyring>=25.0',
              'psutil>=5.9',
              'pyautogui>=0.9.54',
              'pyperclip>=1.8.2',
              'mss>=9.0',
              'Pillow>=10.0',
              'send2trash>=1.8',
              'beautifulsoup4>=4.12',
              'pywin32>=306; sys_platform == "win32"'
            ) | Set-Content -Path requirements.txt -Encoding ascii
          }

          if (-not (Test-Path "main.py")) {
            Write-Host "main.py missing, recreating it"
            Set-Content -Path main.py -Value "import sys`nfrom vega.app import main`n`nif __name__ == '__main__':`n    sys.exit(main())"
          }

          if (-not (Test-Path "vega/app.py")) {
            Write-Host "ERROR: vega/app.py is missing. The vega folder was not uploaded correctly."
            exit 1
          }

          Write-Host "Layout OK"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: requirements failed to install"; exit 1 }
          python -m pip install pillow pyinstaller
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: pillow/pyinstaller failed to install"; exit 1 }

      - name: Verify libraries are installed
        shell: pwsh
        run: |
          python -c "import PySide6, numpy, sounddevice, faster_whisper, edge_tts, httpx, keyring, psutil, pyautogui, pyperclip, mss, PIL, send2trash, bs4, win32api; print('All libraries OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check Vega code imports
        shell: pwsh
        run: |
          Write-Host "Python files found in vega/:"
          Get-ChildItem vega -Recurse -Filter *.py | ForEach-Object { Write-Host (" " + $_.FullName.Substring($PWD.Path.Length + 1)) }
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import vega.app; print('vega imports OK')"
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: the app code fails to import, see above"; exit 1 }

      - name: Make icon
        shell: pwsh
        run: |
          if (Test-Path "tools_dev/make_icon.py") {
            python tools_dev/make_icon.py
          } else {
            Write-Host "make_icon.py missing, skipping icon"
          }

      - name: Write build spec
        shell: pwsh
        run: |
          @'
          import os

          datas, binaries, hidden = [], [], []
          if os.path.isdir("assets"):
              datas.append(("assets", "assets"))

          # list every vega module by hand so none can be missed
          for root, dirs, files in os.walk("vega"):
              for f in files:
                  if f.endswith(".py"):
                      name = os.path.join(root, f)[:-3].replace(os.sep, ".")
                      if name.endswith(".__init__"):
                          name = name[:-9]
                      hidden.append(name)
          print("Vega modules included:", sorted(hidden))

          from PyInstaller.utils.hooks import collect_all
          for pkg in ("faster_whisper", "ctranslate2", "onnxruntime", "av", "tokenizers", "edge_tts",
                      "sounddevice", "_sounddevice_data", "keyring", "certifi", "pyautogui",
                      "pyscreeze", "pytweening", "pymsgbox", "mouseinfo"):
              try:
                  d, b, h = collect_all(pkg)
                  datas += d
                  binaries += b
                  hidden += h
              except Exception as e:
                  print("skip", pkg, e)

          hidden += ["win32timezone", "pythoncom", "pywintypes", "win32com.client",
                     "keyring.backends.Windows", "PySide6.QtMultimedia"]

          icon = "assets/vega.ico" if os.path.exists("assets/vega.ico") else None

          a = Analysis(["main.py"], pathex=[os.getcwd()], binaries=binaries, datas=datas,
                       hiddenimports=hidden, excludes=["tkinter", "matplotlib", "pytest"], noarchive=False)
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [], exclude_binaries=True, name="Vega", console=False, icon=icon)
          coll = COLLECT(exe, a.binaries, a.datas, name="Vega")
          '@ | Set-Content -Path ci.spec -Encoding utf8

      - name: Build exe
        shell: pwsh
        run: |
          python -m PyInstaller ci.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check every Vega file made it into the exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Vega/_internal/PySide6")) {
            Write-Host "ERROR: PySide6 was not bundled into the exe"
            exit 1
          }
          $toc = Get-ChildItem -Recurse build -Filter PYZ-00.toc | Select-Object -First 1
          if (-not $toc) { Write-Host "ERROR: could not find the build contents list"; exit 1 }
          $text = Get-Content $toc.FullName -Raw
          $missing = @()
          foreach ($f in Get-ChildItem vega -Recurse -Filter *.py) {
            $name = $f.FullName.Substring($PWD.Path.Length + 1).Replace("\", ".").Replace("/", ".")
            $name = $name.Substring(0, $name.Length - 3)
            if ($name.EndsWith(".__init__")) { $name = $name.Substring(0, $name.Length - 9) }
            if ($text -notmatch [regex]::Escape("'$name'")) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: these Vega modules did NOT get packed into the exe:"
            $missing | ForEach-Object { Write-Host (" - " + $_) }
            exit 1
          }
          Write-Host "All Vega modules are inside the exe"

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist/Vega -DestinationPath Vega-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-windows
          path: Vega-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vega-windows.zip
